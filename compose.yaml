services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codeguard
      POSTGRES_USER: codeguard
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-codeguard-local}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeguard"]
      interval: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: codeguard
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-codeguard-local}
    ports: ["127.0.0.1:${RABBITMQ_PORT:-5672}:5672", "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
  redis:
    image: redis:7-alpine
    profiles: ["session"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codeguard
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-codeguard-local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-codeguard-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      SESSION_STORE_TYPE: ${SESSION_STORE_TYPE:-none}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes: ["./secrets:/run/secrets:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      start_period: 60s
      retries: 10
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      start_period: 10s
      retries: 5
volumes:
  postgres-data:
  rabbit-data:
  redis-data:
